<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yozuv Poygasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#14161f;--card:#1e2130;--line:#2c3045;--tx:#e8eaf2;--mu:#8b90a8;--ac:#ffb020;--ok:#3ddc84;--er:#ff5c6c;--bl:#4aa8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:840px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:1.4rem;flex:1}h1 span{color:var(--ac)}
.pill{background:var(--card);border-radius:20px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.xp{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}.xp i{display:block;height:100%;background:var(--bl);width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:var(--card);color:var(--mu)}.tabs button.on{background:var(--ac);color:#1a1300}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:1rem}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
label{font-size:.75rem;color:var(--mu)}
select,input.t{display:block;width:100%;margin-top:3px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:1rem}
input.code{text-transform:uppercase;letter-spacing:.2em;text-align:center}
button{background:var(--ac);color:#1a1300;border:0;border-radius:10px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}
button.sec{background:var(--line);color:var(--tx)}button:disabled{opacity:.45;cursor:default}
.err{color:var(--er);font-size:.85rem;min-height:1.2em;margin-top:6px}
.big{font-size:2.4rem;letter-spacing:.3em;font-weight:800;color:var(--ac);text-align:center;margin:6px 0}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.pl:last-child{border:0}
.pl .e{font-size:1.5rem}.pl b{flex:1}.pl small{color:var(--mu)}
.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;background:var(--card);border-radius:10px;padding:6px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--ac)}.stat small{color:var(--mu);font-size:.7rem}
.track{background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.lane{position:relative;height:40px;border-bottom:2px dashed var(--line)}.lane:last-child{border:0}
.name{position:absolute;left:4px;top:1px;font-size:.65rem;color:var(--mu)}
.fin{position:absolute;right:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(#fff 0 6px,#000 6px 12px);opacity:.5}
.car{position:absolute;top:6px;left:0;font-size:1.6rem;will-change:left;display:flex}
.car s{display:inline-block;transform:scaleX(-1);text-decoration:none}
.car u{display:none;text-decoration:none;position:absolute;left:-26px;top:2px;font-size:1.3rem}
.car.nitro u{display:block;animation:fl .15s infinite alternate}@keyframes fl{to{transform:scale(1.3) translateX(-3px)}}
.box{background:var(--card);border-radius:12px;padding:16px;position:relative}
.box.shake{animation:sh .2s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#text{font-size:1.2rem;line-height:1.8;font-family:Georgia,serif;user-select:none;word-break:break-word}
#text .ok{color:var(--ok)}#text .bad{color:#fff;background:var(--er);border-radius:3px}#text .cur{border-bottom:3px solid var(--ac)}#text .rest{color:var(--mu)}
#inp{position:absolute;opacity:0;inset:0;width:100%;height:100%;border:0;resize:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,31,.9);border-radius:12px;font-size:3rem;font-weight:800;color:var(--ac);text-align:center}
#combo{height:22px;margin-top:8px;font-weight:700;color:var(--ac)}
.res{margin-top:12px;background:var(--card);border-radius:12px;padding:16px;display:none}.res h2{margin:0 0 8px}.res p{margin:4px 0;color:var(--mu)}.res b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.item{background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px;text-align:center}.item.sel{border-color:var(--ok)}
.item .e{font-size:2.2rem}.item small{display:block;color:var(--mu);margin:4px 0}.item button{padding:6px 10px;font-size:.85rem;width:100%}
h4{margin:14px 0 8px;color:var(--mu);font-size:1rem}.hint{color:var(--mu);font-size:.8rem;margin-top:10px}.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <h1>Yozuv <span>Poygasi</span> 🏁</h1>
  <span class="pill" id="lvl"></span><span class="pill" id="coins"></span><span class="pill" id="streak"></span>
  <button id="mute" class="sec" style="padding:6px 10px">🔊</button>
 </div>
 <div class="xp"><i id="xpb"></i></div>
 <div class="tabs"><button id="tR" class="on">🏁 Poyga</button><button id="tG">🔧 Garaj</button></div>

 <!-- BOSH SAHIFA -->
 <div id="home">
  <div class="card"><label>Ismingiz<input class="t" id="nick" maxlength="14" placeholder="Masalan: Abdulhafiz"></label></div>
  <div class="card">
   <h3>👥 Do'stlar bilan</h3>
   <div class="row">
    <button id="mk">Xona yaratish</button>
    <div style="display:flex;gap:6px"><input class="t code" id="jc" maxlength="4" placeholder="KOD" style="margin:0"><button id="jn">Kirish</button></div>
   </div>
   <div class="err" id="herr"></div>
  </div>
  <div class="card">
   <h3>🤖 Yakka o'yin (botlar bilan)</h3>
   <div class="row">
    <label>Qiyinlik<select id="diff"><option value="0">Oson botlar</option><option value="1" selected>O'rta botlar</option><option value="2">Qiyin botlar</option></select></label>
    <label>Matn turi<select id="cat"><option value="m">Maqollar</option><option value="q">Qisqa (tez)</option><option value="u">Umumiy matnlar</option></select></label>
   </div>
   <p style="margin:10px 0 0"><button id="solo">Boshlash</button></p>
  </div>
 </div>

 <!-- LOBBI -->
 <div id="lobby" class="hide">
  <div class="card">
   <label style="display:block;text-align:center">Xona kodi</label>
   <div class="big" id="lcode"></div>
   <div class="row" style="justify-content:center"><button class="sec" id="copy">🔗 Havolani nusxalash</button></div>
  </div>
  <div class="card"><h3>O'yinchilar <small id="lcnt" style="color:var(--mu)"></small></h3><div id="plist"></div></div>
  <div class="card" id="hostbox">
   <label>Matn turi<select id="rcat"><option value="m">Maqollar</option><option value="q">Qisqa (tez)</option><option value="u">Umumiy matnlar</option></select></label>
   <p style="margin:10px 0 0"><button id="go" disabled>Poygani boshlash</button></p>
  </div>
  <div class="hint" id="wait"></div>
  <p><button class="sec" id="lv">← Chiqish</button></p>
 </div>

 <!-- POYGA -->
 <div id="race" class="hide">
  <div class="stats">
   <div class="stat"><b id="wpm">0</b><small>so'z/daqiqa</small></div>
   <div class="stat"><b id="acc">100%</b><small>aniqlik</small></div>
   <div class="stat"><b id="best">0</b><small>rekord</small></div>
  </div>
  <div class="track" id="track"></div>
  <div class="box" id="box"><div id="text"></div><textarea id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><div class="msg hide" id="msg"></div></div>
  <div id="combo"></div>
  <div class="res" id="res"></div>
  <p class="hint">O' va g' uchun ' (apostrof) tugmasini bosing. Xatosiz 20 ta harf = NITRO 🔥</p>
 </div>

 <!-- GARAJ -->
 <div id="garage" class="hide"><h4>Mashinalar</h4><div class="grid" id="cars"></div><h4>Ranglar</h4><div class="grid" id="hues"></div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/texts.js"></script>
<script>
const CARS=[["🏎️",0],["🚗",100],["🚕",200],["🚙",300],["🚓",500],["🚑",800]];
const HUES=[[0,0],[140,50],[200,50],[270,80],[320,80],[60,120]];
const BOTN=["Anvar","Dilnoza","Sardor"],BOTC=[1,2,3],SPD=[[14,26],[26,42],[42,68]];
const $=id=>document.getElementById(id);
const norm=c=>"'’‘ʻʼ`´".includes(c)?"'":c;
const esc=s=>String(s).replace(/[<>&"]/g,"");
let S={coins:0,xp:0,car:0,hue:0,oc:[0],oh:[0],best:0,streak:0,last:"",mute:false,name:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("yp3")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("yp3",JSON.stringify(S))}catch(e){}};
let AC;
function beep(f,d=.08,t="sine",v=.06){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const lvOf=x=>Math.floor(Math.sqrt(x/60))+1;
function ui(){const L=lvOf(S.xp),a=60*(L-1)**2,b=60*L**2;
 $("lvl").textContent="⭐ "+L+"-daraja";$("coins").textContent="🪙 "+S.coins;$("streak").textContent="🔥 "+S.streak+" kun";
 $("xpb").style.width=((S.xp-a)/(b-a)*100)+"%";$("best").textContent=S.best;$("mute").textContent=S.mute?"🔇":"🔊"}
const dayKey=d=>d.toISOString().slice(0,10);
function daily(){const t=dayKey(new Date());if(S.last===t)return 0;const y=dayKey(new Date(Date.now()-864e5));S.streak=S.last===y?S.streak+1:1;S.last=t;return Math.min(S.streak,7)*10}

/* ---------- Ekranlar ---------- */
function show(id){["home","lobby","race","garage"].forEach(x=>$(x).classList.toggle("hide",x!==id));
 $("tR").classList.toggle("on",id!=="garage");$("tG").classList.toggle("on",id==="garage")}
let where="home"; // home | lobby | race
$("tR").onclick=()=>{if(where==="race"&&mode==="solo"){stopRace();where="home"}show(where)};
$("tG").onclick=()=>{garage();show("garage")};
$("mute").onclick=()=>{S.mute=!S.mute;save();ui()};

/* ---------- Tarmoq ---------- */
const socket=io();
let mode="solo",room=null,myId=null,isHost=false;
socket.on("connect",()=>{myId=socket.id});
function profile(){S.name=($("nick").value||"").trim().slice(0,14)||"O'yinchi";save();return{name:S.name,car:S.car,hue:S.hue}}
$("nick").value=S.name;
$("mk").onclick=()=>socket.emit("create",{...profile(),cat:$("cat").value},r=>{if(r.ok)enterLobby()});
$("jn").onclick=()=>socket.emit("join",{...profile(),code:$("jc").value},r=>{
 if(!r.ok){$("herr").textContent=r.error;return}$("herr").textContent="";enterLobby()});
$("jc").addEventListener("keydown",e=>{if(e.key==="Enter")$("jn").click()});
function enterLobby(){mode="multi";where="lobby";show("lobby")}
socket.on("room",r=>{room=r;isHost=r.host===myId;if(mode==="multi"&&where==="lobby")drawLobby()});
function drawLobby(){
 $("lcode").textContent=room.code;
 $("lcnt").textContent="("+room.players.length+"/8)";
 $("plist").innerHTML=room.players.map(p=>`<div class="pl"><span class="e" style="filter:hue-rotate(${HUES[p.hue][0]}deg)">${CARS[p.car][0]}</span><b>${esc(p.name)}</b><small>${p.id===room.host?"👑 xona egasi":""}${p.id===myId?" (siz)":""}</small></div>`).join("");
 $("hostbox").classList.toggle("hide",!isHost);
 $("rcat").value=room.cat;
 $("go").disabled=room.players.length<2;
 $("wait").textContent=isHost?(room.players.length<2?"Do'stlaringizni kutyapmiz. Kodni yoki havolani yuboring.":""):"Xona egasi poygani boshlashini kuting...";
}
$("rcat").onchange=()=>socket.emit("cat",$("rcat").value);
$("go").onclick=()=>socket.emit("start");
$("lv").onclick=()=>{socket.emit("leave");room=null;mode="solo";where="home";show("home")};
$("copy").onclick=async()=>{const u=location.origin+location.pathname+"?room="+room.code;try{await navigator.clipboard.writeText(u);$("copy").textContent="✅ Nusxalandi"}catch(e){prompt("Havola:",u)}setTimeout(()=>$("copy").textContent="🔗 Havolani nusxalash",1800)};
const q=new URLSearchParams(location.search).get("room");if(q){$("jc").value=q.toUpperCase().slice(0,4);$("herr").textContent="Ismingizni yozing va «Kirish» tugmasini bosing"}

/* ---------- Poyga motori ---------- */
let text,lanes,prog,state="idle",t0,errors,keys,prev,raf,lastTs,combo,nitros,lastText="",spd,botFin,myPlace,lastSend=0,cdIv;
const idx=id=>lanes.findIndex(l=>l.id===id);
function buildTrack(){
 $("track").innerHTML=lanes.map((l,i)=>`<div class="lane"><span class="name">${esc(l.name)}${l.id===myId||l.id==="me"?" (siz)":""}</span><div class="fin"></div><div class="car" id="car${i}"><s style="filter:hue-rotate(${HUES[l.hue][0]}deg)">${CARS[l.car][0]}</s><u>🔥</u></div></div>`).join("")}
function render(v){let ok=0;while(ok<v.length&&norm(v[ok])==norm(text[ok]))ok++;let h="";
 for(let i=0;i<text.length;i++){const c=text[i]===" "?"&nbsp;":text[i];h+=`<span class="${i<ok?"ok":i<v.length?"bad":i===v.length?"cur rest":"rest"}">${c}</span>`}
 $("text").innerHTML=h;return ok}
function place(){lanes.forEach((l,i)=>{const c=$("car"+i);if(!c)return;c.style.left=(Math.min(prog[l.id]||0,1)*(c.parentElement.clientWidth-44))+"px"})}
const meId=()=>mode==="solo"?"me":myId;
function resetRace(){prog={};lanes.forEach(l=>prog[l.id]=0);errors=0;keys=0;prev=0;combo=0;nitros=0;myPlace=0;botFin=[];
 $("inp").value="";$("res").style.display="none";$("combo").textContent="";$("wpm").textContent="0";$("acc").textContent="100%";
 buildTrack();render("");place();$("text").parentElement.classList.remove("shake")}
function startCountdown(startAt){
 state="count";const m=$("msg");m.classList.remove("hide");let last=0;
 clearInterval(cdIv);
 cdIv=setInterval(()=>{const rem=startAt-Date.now();
  if(rem>0){const n=Math.ceil(rem/1000);if(n!==last){last=n;m.textContent=n;beep(440,.15)}}
  else{clearInterval(cdIv);m.classList.add("hide");beep(880,.3,"square");state="run";t0=lastTs=performance.now();$("inp").focus();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
 },50)}
function stopRace(){clearInterval(cdIv);cancelAnimationFrame(raf);state="idle"}
$("solo").onclick=()=>{
 mode="solo";where="race";show("race");
 const p=profile();text=TEXTS.make($("cat").value,lastText);lastText=text;
 lanes=[{id:"me",name:p.name,car:S.car,hue:S.hue},...BOTN.map((n,i)=>({id:"b"+i,name:"Bot "+n,car:BOTC[i],hue:i*90}))];
 const[lo,hi]=SPD[+$("diff").value];spd={};lanes.slice(1).forEach(l=>spd[l.id]=(lo+Math.random()*(hi-lo))*5/60);
 resetRace();startCountdown(Date.now()+3000)};
let offset=0;
socket.on("go",d=>{
 mode="multi";where="race";room=d.room;show("race");text=d.text;
 const me=d.room.players.find(p=>p.id===myId),others=d.room.players.filter(p=>p.id!==myId);
 lanes=[me,...others].map(p=>({id:p.id,name:p.name,car:p.car,hue:p.hue}));
 offset=d.serverNow-Date.now();resetRace();startCountdown(d.startAt-offset)});
socket.on("prog",d=>{if(mode!=="multi"||!prog||!(d.id in prog)||d.id===myId&&state==="run")return;prog[d.id]=d.p;if(d.id===myId&&d.place)myPlace=d.place});
function loop(ts){
 if(state==="idle")return;
 const dt=(ts-lastTs)/1000;lastTs=ts;
 if(mode==="solo"&&state==="run"){lanes.slice(1).forEach(l=>{if(prog[l.id]>=1)return;prog[l.id]+=spd[l.id]*(.7+Math.random()*.6)*dt/text.length;if(prog[l.id]>=1){prog[l.id]=1;botFin.push(l.id)}})}
 place();
 if(state==="run"){const m=(ts-t0)/60000;if(m>.02)$("wpm").textContent=Math.round(prog[meId()]*text.length/5/m)}
 raf=requestAnimationFrame(loop)}
$("inp").addEventListener("input",()=>{
 if(state!=="run"){$("inp").value="";return}
 let v=$("inp").value;if(v.length>text.length){v=v.slice(0,text.length);$("inp").value=v}
 const ok=render(v),box=$("box"),id=meId();
 if(v.length>prev){keys++;
  if(ok<v.length){errors++;combo=0;beep(150,.12,"sawtooth",.05);box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");$("combo").textContent=""}
  else{combo++;beep(700+Math.min(combo,20)*20,.04,"sine",.03);
   if(combo%20===0){nitros++;beep(1200,.25,"square",.05);const c=$("car0");c.classList.add("nitro");setTimeout(()=>c.classList.remove("nitro"),1500);$("combo").textContent="🔥 NITRO x"+nitros+"!"}
   else if(!$("combo").textContent.startsWith("🔥"))$("combo").textContent=combo>=5?"Seriya: "+combo:""}}
 prev=v.length;prog[id]=ok/text.length;
 $("acc").textContent=keys?Math.max(0,Math.round((1-errors/keys)*100))+"%":"100%";
 place();
 if(mode==="multi"){const now=Date.now();if(now-lastSend>100||ok===text.length){lastSend=now;socket.emit("progress",{p:prog[id],wpm:+$("wpm").textContent||0})}}
 if(ok===text.length)finishMe()});
function reward(pos,total){
 const m=(performance.now()-t0)/60000,wpm=Math.round(text.length/5/m),acc=Math.max(0,Math.round((1-errors/keys)*100));
 const mult=mode==="multi"?1.5:1+ +$("diff").value*.5;
 const base=Math.round(([0,50,30,20,10][pos]||5)*mult),accB=acc>=98?20:acc>=95?10:0,nB=nitros*5,dB=daily();
 const gain=base+accB+nB+dB;S.coins+=gain;S.xp+=wpm+gain;
 let rec="";if(wpm>S.best){S.best=wpm;rec=" 🎉 Yangi rekord!"}
 save();ui();return{wpm,acc,gain,rec,base,accB,nB,dB,time:(m*60).toFixed(1)}}
const detail=r=>`<p>Tezlik: <b>${r.wpm} so'z/daqiqa</b> · Aniqlik: <b>${r.acc}%</b> · Nitro: <b>${nitros}</b></p><p>Mukofot: <b>🪙 ${r.gain}</b> (o'rin ${r.base}${r.accB?`, aniqlik +${r.accB}`:""}${r.nB?`, nitro +${r.nB}`:""}${r.dB?`, kunlik +${r.dB}`:""})</p>`;
const MEDAL=["","🥇","🥈","🥉"];
function finishMe(){
 state="done";beep(1000,.4,"triangle",.06);$("wpm").textContent=Math.round(text.length/5/((performance.now()-t0)/60000));
 if(mode==="solo"){cancelAnimationFrame(raf);const pos=botFin.length+1,r=reward(pos);
  $("res").style.display="block";
  $("res").innerHTML=`<h2>${MEDAL[pos]||pos+"-o'rin"} ${pos}-o'rin${r.rec}</h2>${detail(r)}<p style="margin-top:10px"><button id="again">Yana poyga</button> <button class="sec" id="menu">Menyu</button></p>`;
  $("again").onclick=()=>$("solo").click();$("menu").onclick=()=>{where="home";show("home")}}
 else{$("res").style.display="block";$("res").innerHTML=`<h2>🏁 Tugatdingiz!</h2><p>Boshqa o'yinchilar tugatishini kutyapmiz...</p>`}}
socket.on("end",d=>{
 if(mode!=="multi")return;room=d.room;
 const mine=d.results.find(x=>x.id===myId);
 if(state==="run"){state="done";$("inp").blur()}  // vaqt tugadi
 cancelAnimationFrame(raf);
 let r={gain:0,wpm:mine.wpm,acc:0,rec:"",base:0};
 if(mine.place&&keys){r=reward(mine.rank,d.results.length)}
 const rows=d.results.map(x=>`<div class="pl"><span class="e">${MEDAL[x.rank]||x.rank+"."}</span><b>${esc(x.name)}${x.id===myId?" (siz)":""}</b><small>${x.place?x.wpm+" s/d":"tugatmadi"}</small></div>`).join("");
 $("res").style.display="block";
 $("res").innerHTML=`<h2>Natijalar${r.rec}</h2>${rows}${mine.place?detail(r):""}<p style="margin-top:10px"><button id="back">Xonaga qaytish</button></p>`;
 $("back").onclick=()=>{where="lobby";state="idle";show("lobby");drawLobby()}});

/* ---------- Garaj ---------- */
function garage(){
 $("cars").innerHTML=CARS.map((c,i)=>{const o=S.oc.includes(i);return `<div class="item ${S.car===i?"sel":""}"><div class="e">${c[0]}</div><small>${o?"Sizniki":"🪙 "+c[1]}</small><button data-c="${i}">${S.car===i?"Tanlangan":o?"Tanlash":"Sotib olish"}</button></div>`}).join("");
 $("hues").innerHTML=HUES.map((h,i)=>{const o=S.oh.includes(i);return `<div class="item ${S.hue===i?"sel":""}"><div class="e" style="filter:hue-rotate(${h[0]}deg)">${CARS[S.car][0]}</div><small>${o?"Sizniki":"🪙 "+h[1]}</small><button data-h="${i}">${S.hue===i?"Tanlangan":o?"Tanlash":"Sotib olish"}</button></div>`}).join("")}
$("garage").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 const isC=b.dataset.c!==undefined,i=+(isC?b.dataset.c:b.dataset.h),own=isC?S.oc:S.oh,price=(isC?CARS:HUES)[i][1];
 if(!own.includes(i)){if(S.coins<price){beep(150,.2,"sawtooth");b.textContent="Tanga yetmaydi";return}S.coins-=price;own.push(i);beep(900,.2,"triangle")}
 if(isC)S.car=i;else S.hue=i;save();ui();garage()});
$("box").addEventListener("click",()=>{if(state==="run")$("inp").focus()});
window.addEventListener("resize",()=>lanes&&prog&&place());
ui();
</script>
</body>
</html>
